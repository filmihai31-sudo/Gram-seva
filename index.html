<!doctype html>
<html lang="hi" class="overflow-x-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="स्थानीय दुकान और मिस्त्री खोजने के लिए ऐप - ग्राम सेवा" />
    <title>ग्राम सेवा - ग्रामीण मिस्त्री व स्थानीय दुकान डायरेक्टरी</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="overflow-x-hidden bg-slate-100 text-slate-900 antialiased">
    <div id="root" class="overflow-x-hidden min-h-screen"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW Registered successfully:', registration.scope);
            })
            .catch((error) => {
              console.log('SW Registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
