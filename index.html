    <script>
      // 2. Enable Silent Auto-Updates (Auto-Fetch new GitHub / Cloudflare builds)
      if ('serviceWorker' in navigator) {
        // Reload page when new service worker takes control so user gets fresh build instantly
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            console.log('[PWA] New service worker activated, auto-refreshing for new build');
            window.location.reload();
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('[PWA] Service Worker registered with scope:', registration.scope);

              // Check for updates on initial registration
              registration.update().catch(() => {});

              // Auto-check for updates whenever user re-opens / switches back to the app
              document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                  console.log('[PWA] App resumed into focus, checking for new builds...');
                  registration.update().catch(() => {});
                }
              });

              // Periodic update check every 5 minutes while open
              setInterval(() => {
                registration.update().catch(() => {});
              }, 5 * 60 * 1000);
            })
            .catch((err) => {
              console.warn('[PWA] ServiceWorker registration failed:', err);
            });
        });
      }
    </script>
